<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <pattern id="winding-rot" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#3b6ea5"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#a9c4e4" stroke-width="1.2"/>
    </pattern>
    <pattern id="winding-fix" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#a8742c"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#ecd2a8" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="spin" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="lead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#333"/>
    </marker>
  </defs>

  <rect width="760" height="440" rx="10" fill="#ffffff"/>

  <!-- rotation axis -->
  <line x1="380" y1="22" x2="380" y2="418" stroke="#999" stroke-width="1" stroke-dasharray="8 4 2 4"/>
  <path d="M352,24 A28,9 0 1,0 404,20" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#spin)"/>

  <!-- rotating head -->
  <rect x="200" y="40" width="360" height="150" rx="14" fill="#e3edf8" stroke="#3b6ea5" stroke-width="2"/>
  <text x="216" y="64" font-weight="600" fill="#1f4670">Rotating head</text>
  <rect x="470" y="78" width="72" height="54" rx="4" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="506" y="101" text-anchor="middle" font-size="12" fill="#1f4670">laser +</text>
  <text x="506" y="117" text-anchor="middle" font-size="12" fill="#1f4670">detector</text>
  <line x1="542" y1="96" x2="612" y2="96" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="612" y1="114" x2="546" y2="114" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="620" y="110" font-size="12" fill="#555">to the room</text>
  <rect x="216" y="164" width="328" height="10" fill="#2f7d4f"/>
  <text x="216" y="154" font-size="12" fill="#1f4670">head PCB: ranging, MCU, rectifier + regulator</text>

  <!-- IR LED on the axis -->
  <path d="M371,176 L389,176 L380,190 z" fill="#c0392b"/>

  <!-- rotating coil (inner tube) -->
  <rect x="344" y="174" width="12" height="122" fill="url(#winding-rot)" stroke="#1f4670" stroke-width="1"/>
  <rect x="404" y="174" width="12" height="122" fill="url(#winding-rot)" stroke="#1f4670" stroke-width="1"/>

  <!-- stationary coil (outer tube) -->
  <rect x="320" y="212" width="12" height="114" fill="url(#winding-fix)" stroke="#6b4a19" stroke-width="1"/>
  <rect x="428" y="212" width="12" height="114" fill="url(#winding-fix)" stroke="#6b4a19" stroke-width="1"/>

  <!-- IR beam down the hollow center -->
  <line x1="380" y1="194" x2="380" y2="320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/>

  <!-- stationary base -->
  <rect x="160" y="300" width="440" height="100" rx="10" fill="#f6eee2" stroke="#a8742c" stroke-width="2"/>
  <rect x="176" y="330" width="408" height="10" fill="#2f7d4f"/>
  <rect x="370" y="322" width="20" height="8" fill="#333"/>
  <text x="176" y="362" font-size="12" fill="#6b4a19">base PCB: coil driver, IR receiver, motor drive</text>
  <text x="176" y="386" font-weight="600" fill="#6b4a19">Stationary base</text>
  <line x1="160" y1="335" x2="96" y2="335" stroke="#555" stroke-width="3"/>
  <text x="92" y="330" text-anchor="end" font-size="12" fill="#555">UART</text>
  <text x="92" y="346" text-anchor="end" font-size="12" fill="#555">+ 5 V</text>

  <!-- callouts, left -->
  <line x1="344" y1="248" x2="170" y2="248" stroke="#333" stroke-width="1" marker-start="url(#lead)"/>
  <text x="164" y="244" text-anchor="end" font-size="13" fill="#1f4670">rotating coil</text>
  <text x="164" y="260" text-anchor="end" font-size="12" fill="#555">picks up the field</text>
  <line x1="320" y1="290" x2="170" y2="290" stroke="#333" stroke-width="1" marker-start="url(#lead)"/>
  <text x="164" y="286" text-anchor="end" font-size="13" fill="#6b4a19">stationary coil</text>
  <text x="164" y="302" text-anchor="end" font-size="12" fill="#555">driven with AC</text>

  <!-- callouts, right -->
  <line x1="389" y1="183" x2="590" y2="183" stroke="#333" stroke-width="1" marker-start="url(#lead)"/>
  <text x="596" y="179" font-size="13" fill="#c0392b">IR LED on the axis</text>
  <text x="596" y="195" font-size="12" fill="#555">streams scan data</text>
  <line x1="390" y1="326" x2="420" y2="350" stroke="#333" stroke-width="1" marker-start="url(#lead)"/>
  <line x1="420" y1="350" x2="610" y2="350" stroke="#333" stroke-width="1"/>
  <text x="616" y="346" font-size="13" fill="#333">phototransistor</text>
  <text x="616" y="362" font-size="12" fill="#555">sees the LED at</text>
  <text x="616" y="376" font-size="12" fill="#555">every angle</text>
  <line x1="338" y1="204" x2="170" y2="204" stroke="#333" stroke-width="1" marker-start="url(#lead)"/>
  <text x="164" y="200" text-anchor="end" font-size="13" fill="#333">air gap</text>
  <text x="164" y="216" text-anchor="end" font-size="12" fill="#555">nothing touches</text>
</svg>
