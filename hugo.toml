baseURL = "https://blog.mtlevine0.com"
locale = "en-us"
title = "Matt's Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true

[params]
  author = "Matt Levine"
  description = "Build logs from Matt Levine's electronics side projects: display tubes, LEDs, lidar, custom PCBs and firmware."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowPostTree = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true

[params.homeInfoParams]
  Title = "Hi, I'm Matt 👋"
  Content = """
Build logs from my side projects: vintage display tubes, LEDs, lidar, custom PCBs and firmware. Each project is written up one milestone at a time.
"""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/mtlevine0"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/matt-levine-a0a38188"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    ID = "G-N1GFLRZM7D"
