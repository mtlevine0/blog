{{- if and .IsPage (strings.Contains .RawContent "```mermaid") }}
<!-- Mermaid diagrams (see layouts/_markup/render-codeblock-mermaid.html).
     Re-renders on theme toggle so diagrams follow PaperMod's light/dark mode. -->
<script type="module">
// Module scripts are deferred, so this runs after the body is parsed.
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

var blocks = document.querySelectorAll("pre.mermaid");
blocks.forEach(function (el) { el.dataset.source = el.textContent; });

// PaperMod marks the active theme with <html data-theme="dark|light">.
// Each diagram gets a fixed id; mermaid's own ids are clock-based and can collide.
async function render() {
    var dark = document.documentElement.dataset.theme === "dark";
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
    for (var i = 0; i < blocks.length; i++) {
        var out = await mermaid.render("mermaid-diagram-" + i, blocks[i].dataset.source);
        blocks[i].innerHTML = out.svg;
    }
}

render();
var toggle = document.getElementById("theme-toggle");
if (toggle) toggle.addEventListener("click", function () { setTimeout(render, 0); });
</script>
{{- end }}
